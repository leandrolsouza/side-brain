name: Build and Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');

            // Check if a release already exists for this tag
            let release;
            try {
              const { data: existing } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag,
              });
              // If it exists and is published, delete it so we can recreate as draft
              if (!existing.draft) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: existing.id,
                });
                const { data: created } = await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  name: `SideBrain ${tag}`,
                  draft: true,
                  prerelease: tag.includes('beta') || tag.includes('alpha'),
                  generate_release_notes: true,
                });
                release = created;
              } else {
                // Reuse existing draft release
                release = existing;
              }
            } catch (e) {
              if (e.status === 404) {
                // No existing release, create a new one
                const { data: created } = await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  name: `SideBrain ${tag}`,
                  draft: true,
                  prerelease: tag.includes('beta') || tag.includes('alpha'),
                  generate_release_notes: true,
                });
                release = created;
              } else {
                throw e;
              }
            }

            core.setOutput('release_id', String(release.id));

  build:
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder-args: --win
            asset-extensions: ".exe,.msi,.blockmap"
            asset-manifest: latest.yml
          - os: macos-latest
            builder-args: --mac
            asset-extensions: ".dmg,.zip,.blockmap"
            asset-manifest: latest-mac.yml
          - os: ubuntu-latest
            builder-args: --linux
            asset-extensions: ".AppImage,.deb,.blockmap"
            asset-manifest: latest-linux.yml

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # NOTE: builds are currently unsigned. To enable code signing, provide
      # certificates via secrets (CSC_LINK / CSC_KEY_PASSWORD for Windows,
      # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / CSC_* for macOS notarization)
      # and pass them as env vars to the electron-builder step below.
      - name: Build and package
        run: |
          npm run build
          npx electron-builder ${{ matrix.builder-args }} --publish never

      - name: Upload assets to release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          ASSET_EXTENSIONS: ${{ matrix.asset-extensions }}
          ASSET_MANIFEST: ${{ matrix.asset-manifest }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const releaseId = parseInt(process.env.RELEASE_ID);
            const extensions = process.env.ASSET_EXTENSIONS.split(',');
            const manifest = process.env.ASSET_MANIFEST;
            const releaseDir = path.join(process.env.GITHUB_WORKSPACE, 'release');
            const files = fs.readdirSync(releaseDir).filter(f => {
              return extensions.some(ext => f.endsWith(ext)) || f === manifest;
            });
            for (const file of files) {
              const filePath = path.join(releaseDir, file);
              const stat = fs.statSync(filePath);
              if (!stat.isFile()) continue;
              console.log(`Uploading ${file} (${stat.size} bytes)`);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                name: file,
                data: fs.readFileSync(filePath),
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': stat.size,
                },
              });
            }

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish Release
        uses: actions/github-script@v7
        with:
          script: |
            const releaseId = ${{ needs.create-release.outputs.release_id }};

            // Check current release state before updating
            const { data: release } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
            });

            if (!release.draft) {
              console.log('Release is already published, skipping.');
              return;
            }

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              draft: false,
            });
