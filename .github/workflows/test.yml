name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint (Biome)
        run: npx biome ci .

      - name: Type check
        run: npm run typecheck

      - name: Check i18n keys
        run: npm run check-i18n

      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native modules for Node.js
        run: npm rebuild better-sqlite3

      - name: Run main process tests
        run: npx vitest run --config vitest.config.main.ts

      - name: Run renderer tests
        run: npx vitest run --config vitest.config.renderer.ts
